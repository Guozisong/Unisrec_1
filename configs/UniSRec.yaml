# 序列编码器（Transformer）
n_layers: 2                  # Transformer 层数
n_heads: 2                   # 每层注意力头数
hidden_size: 300             # 序列和商品表示的维度
inner_size: 256              # 前馈网络中间层维度
hidden_dropout_prob: 0.5     # 隐藏层 dropout 比例
attn_dropout_prob: 0.5       # 注意力权重 dropout 比例
hidden_act: 'gelu'           # 前馈网络激活函数
layer_norm_eps: 1e-12       # LayerNorm 的数值稳定项
initializer_range: 0.02     # 参数初始化范围
loss_type: 'CE'             # 微调损失函数类型

# 预训练时的序列增强与对比学习
item_drop_ratio: 0.2         # 商品随机丢弃比例
item_drop_coefficient: 0.9   # 采用商品丢弃增强的概率
lambda: 1e-3                # 序列与增强序列对比损失的权重

# 商品文本向量与混合专家适配器
plm_suffix: feat1CLS        # 原始文本向量文件后缀
plm_suffix_aug: feat2CLS    # 增强文本向量文件后缀
plm_size: 768               # 文本编码器输出向量维度
adaptor_dropout_prob: 0.2   # 适配器 dropout 比例
adaptor_layers: [768,300]   # 适配器各层的输入和输出维度
temperature: 0.07           # 对比学习和微调 logits 的温度系数
n_exps: 8                   # 混合专家适配器的专家数量
